[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photontorch"
dynamic = ["version"]
description = "PhotonTorch: a photonic simulation framework based on the deep learning framework PyTorch."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Floris Laporte", email = "floris.laporte@ugent.be"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Torch 2.13 removed tensor.names, which Network._handle_source still uses.
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.2",
    "torch>=2.2.0,<2.13",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7.3"]
graph = ["matplotlib>=3.7.3", "networkx>=2.5"]
lfilter = ["torch-lfilter"]
examples = ["matplotlib>=3.7.3", "tqdm>=4.40"]
test = ["coverage>=4.5", "pytest>=3.8.0", "pytest-cov>=2.6"]
docs = ["nbsphinx", "sphinx>=3.0"]

[project.urls]
Homepage = "http://github.com/flaport/photontorch"

[tool.setuptools.packages.find]
include = ["photontorch*"]

[tool.setuptools.dynamic]
version = {attr = "photontorch._version.__version__"}
